
# This will creates a Qdrant container locally via Docker during the startup of the app
# Port 6334 is used by Spring AI for communication (gRPC)
services:
  qdrant:
    image: 'qdrant/qdrant:latest'
    ports:
      - '6333:6333'
      - '6334:6334'
